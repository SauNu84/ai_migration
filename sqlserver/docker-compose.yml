# =============================================================================
# Containerized SQL Server source for the SAU-323 lane — the analogue of the
# Postgres :5599 rig. Brings up a single SQL Server 2022 instance, published on
# host port 14333 (1433 in-container), so the core loop can profile + reconcile
# against a real, trap-rich SQL Server source.
#
#   docker compose -f sqlserver/docker-compose.yml up -d      # start
#   ./sqlserver/scripts/setup.sh                              # schema + seed + verify
#   docker compose -f sqlserver/docker-compose.yml down -v    # tear down
#
# Default SA password is dev-only. Override with MSSQL_SA_PASSWORD in the env.
# SQL Server requires a strong password: >=8 chars, 3 of {upper,lower,digit,sym}.
# =============================================================================
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sau323-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Phase1_Str0ng!Pass}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_HOST_PORT:-14333}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # Dependency-free TCP readiness: the server image may not bundle sqlcmd, so
      # just confirm the port is listening. setup.sh does the real SELECT 1 probe.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mssql_data:
